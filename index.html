};
const donutChart=(done,total)=>{
  const pct=total?done/total:0;
  const r=52,cx=88,cy=80,circ=2*Math.PI*r;
  const da=(pct*circ)+" "+(circ-pct*circ);
  const pctTxt=Math.round(pct*100)+"%";
  const cntTxt=done+"/"+total+" orang";
  return html`<svg width="176" height="160" viewBox="0 0 176 160">
    <circle cx=${cx} cy=${cy} r=${r} fill="none" stroke="#FEE2E2" strokeWidth="18"/>
    <circle cx=${cx} cy=${cy} r=${r} fill="none" stroke="#16A34A" strokeWidth="18" strokeDasharray=${da} strokeDashoffset=${circ/4} strokeLinecap="round"/>
    <text x=${cx} y=${cy-7} textAnchor="middle" fontSize="20" fontWeight="700" fill="#111827">${pctTxt}</text>
    <text x=${cx} y=${cy+12} textAnchor="middle" fontSize="10" fill="#6B7280">${cntTxt}</text>
    <text x=${cx} y=${cy+27} textAnchor="middle" fontSize="9" fill="#9CA3AF">dicoktas</text>
  </svg>`;
};

/* ── KOMPONEN REACT (punya state, harus dipanggil sebagai <${Comp}/>) ── */
function Modal({title,onClose,children}){
  return html`<div style=${{position:"fixed",inset:0,background:"rgba(0,0,0,.5)",zIndex:9999,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
    <div style=${{background:"#fff",borderRadius:16,width:"100%",maxWidth:540,maxHeight:"92vh",overflowY:"auto",boxShadow:"0 20px 60px rgba(0,0,0,.3)"}}>
      <div style=${{background:"linear-gradient(135deg,#7F1D1D,#991B1B)",padding:"14px 20px",borderRadius:"16px 16px 0 0",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <span style=${{fontWeight:700,color:"#fff",fontSize:15}}>${title}</span>
        <button onClick=${onClose} style=${{background:"rgba(255,255,255,.2)",border:"none",borderRadius:6,width:28,height:28,cursor:"pointer",color:"#fff",fontSize:16}}>x</button>
      </div>
      <div style=${{padding:20}}>${children}</div>
    </div>
  </div>`;
}

function CoktasModal({p,onConfirm,onCancel}){
  const [petugas,setPetugas]=useState((TP[p.tim]||[])[0]||"");
  const [catatan,setCatatan]=useState("");
  const ok=()=>{
    if(!petugas.trim()){alert("Nama petugas wajib diisi!");return;}
    if(!catatan.trim()){alert("Catatan wajib diisi!");return;}
    onConfirm(p,petugas,catatan);
  };
  const opts=(TP[p.tim]||[]);
  return html`<${Modal} title="Konfirmasi Coktas" onClose=${onCancel}>
    <div style=${{background:"#F0FDF4",border:"1px solid #BBF7D0",borderRadius:10,padding:14,marginBottom:16}}>
      <div style=${{fontWeight:700,fontSize:15,color:"#166534"}}>${p.nama}</div>
      <div style=${{fontSize:12,color:"#6B7280",marginTop:3}}>${p.nik+" - "+p.kel}</div>
      <div style=${{fontSize:12,color:"#6B7280",marginTop:3}}>📍 ${p.alamat}</div>
      ${p.petunjuk?html`<div style=${{marginTop:6,fontSize:11,color:"#92400E",background:"#FFFBEB",borderRadius:4,padding:"2px 8px",display:"inline-block"}}>📌 ${p.petunjuk}</div>`:null}
    </div>
    <div style=${{marginBottom:14}}>
      <label style=${{fontSize:12,fontWeight:600,color:"#374151",display:"block",marginBottom:6}}>Nama Petugas Coktas *</label>
      <select value=${petugas} onChange=${e=>setPetugas(e.target.value)} class=${INP}>
        ${opts.map(o=>html`<option key=${o} value=${o}>${o}</option>`)}
        <option value="Lainnya">Lainnya (isi manual)</option>
      </select>
      ${petugas==="Lainnya"?html`<input onChange=${e=>setPetugas(e.target.value)} placeholder="Ketik nama petugas..." class=${INP} style=${{marginTop:6}}/>`:null}
    </div>
    <div style=${{marginBottom:18}}>
      <label style=${{fontSize:12,fontWeight:600,color:"#374151",display:"block",marginBottom:6}}>Catatan Hasil Coktas *</label>
      <textarea value=${catatan} onChange=${e=>setCatatan(e.target.value)} rows="3" placeholder="Contoh: Pemilih hadir, data sesuai DPT." class=${INP}/>
    </div>
    <div style=${{display:"flex",gap:10}}>
      <button onClick=${ok} style=${{flex:1,background:"#16A34A",color:"#fff",border:"none",borderRadius:10,padding:"10px",fontWeight:700,cursor:"pointer",fontSize:14}}>Konfirmasi Coktas</button>
      <button onClick=${onCancel} style=${{padding:"10px 18px",border:"1px solid #E5E7EB",borderRadius:10,cursor:"pointer",background:"#fff",color:"#6B7280"}}>Batal</button>
    </div>
  </${Modal}>`;
}

function KegForm({keg,onSave,onCancel}){

  return html`<div class="s4">
    <p style=${{fontWeight:700,fontSize:14,margin:0}}>Edit ${keg.tim}</p>
    <div class="g2s">
      <div class="sp2"><label style=${{display:"block",fontSize:11,fontWeight:600,color:"#6B7280",marginBottom:4}}>PIC</label><input value=${f.pic} onChange=${e=>setF({...f,pic:e.target.value})} class=${INP}/></div>
      <div class="sp2"><label style=${{display:"block",fontSize:11,fontWeight:600,color:"#6B7280",marginBottom:4}}>Keterangan Cakupan</label><input value=${f.ket} onChange=${e=>setF({...f,ket:e.target.value})} class=${INP}/></div>
      <div><label style=${{display:"block",fontSize:11,fontWeight:600,color:"#6B7280",marginBottom:4}}>Status</label>
        <select value=${f.status} onChange=${e=>setF({...f,status:e.target.value})} class=${INP}>
          ${scKeys.map(s=>html`<option key=${s} value=${s}>${s}</option>`)}
        </select></div>
      <div><label style=${{display:"block",fontSize:11,fontWeight:600,color:"#6B7280",marginBottom:4}}>Prioritas</label>
        <select value=${f.prioritas} onChange=${e=>setF({...f,prioritas:e.target.value})} class=${INP}>
          <option>Tinggi</option><option>Sedang</option><option>Rendah</option>
        </select></div>
      <div class="sp2"><label style=${{display:"block",fontSize:11,fontWeight:600,color:"#6B7280",marginBottom:4}}>Catatan Kendala</label><input value=${f.catatan} onChange=${e=>setF({...f,catatan:e.target.value})} placeholder="Opsional..." class=${INP}/></div>
    </div>
    <div style=${{display:"flex",gap:8}}>
      <button onClick=${()=>onSave(f)} style=${{background:"#991B1B",color:"#fff",border:"none",borderRadius:8,padding:"8px 20px",fontWeight:600,cursor:"pointer"}}>Simpan</button>
      <button onClick=${onCancel} style=${{background:"none",border:"1px solid #E5E7EB",borderRadius:8,padding:"8px 14px",cursor:"pointer",color:"#6B7280"}}>Batal</button>
    </div>
  </div>`;
}

/* KegCard - komponen untuk monitoring card (menghindari template terlalu dalam) */
function KegCard({k,pemilih,canEdit,exp,setExp,editKeg,setEditKeg,updateStatus,saveKeg,handleToggle}){
  const byKel=KELS.map(kel=>({kel,items:pemilih.filter(p=>p.tim===k.tim&&p.kel===kel)})).filter(x=>x.items.length>0);
  const timColor=TC[k.tim]||"#991B1B";
  const isEdit=editKeg===k.id&&canEdit;
  const isExp=exp[k.tim];
  const scKeys=Object.keys(SC);

  if(isEdit){
    return html`<${KegForm} keg=${k} onSave=${f=>saveKeg(k.id,f)} onCancel=${()=>setEditKeg(null)}/>`;
  }

  return html`<div>
    <div style=${{display:"flex",justifyContent:"space-between",flexWrap:"wrap",gap:10,marginBottom:12}}>
      <div>
        <div style=${{display:"flex",gap:6,flexWrap:"wrap",marginBottom:5,alignItems:"center"}}>
          ${tBadge(k.tim)}${sBadge(k.status)}
          <span style=${{fontSize:11,background:"#FEF2F2",color:"#B91C1C",padding:"2px 8px",borderRadius:999}}>${k.prioritas}</span>
        </div>
        <div style=${{fontSize:11,color:"#6B7280"}}>${k.pic}</div>
        <div style=${{fontSize:10,color:"#9CA3AF",marginTop:2}}>${k.ket}</div>
      </div>
      ${canEdit?html`<div style=${{display:"flex",gap:6,flexShrink:0}}>
        <select value=${k.status} onChange=${e=>updateStatus(k.id,e.target.value)} style=${{fontSize:11,border:"1px solid #E5E7EB",borderRadius:8,padding:"4px 8px",background:"#fff",cursor:"pointer"}}>
          ${scKeys.map(s=>html`<option key=${s} value=${s}>${s}</option>`)}
        </select>
        <button onClick=${()=>setEditKeg(k.id)} style=${{fontSize:11,border:"1px solid #E5E7EB",borderRadius:8,padding:"4px 10px",cursor:"pointer",background:"#fff"}}>Edit</button>
      </div>`:null}
    </div>
    <div style=${{marginBottom:12}}>
      <div style=${{display:"flex",justifyContent:"space-between",fontSize:11,color:"#6B7280",marginBottom:4}}>
        <span>Progress</span><span style=${{fontWeight:900,color:timColor}}>${k.done+"/"+k.total+" ("+k.progres+"%)"}</span>
      </div>
      ${pBar(k.progres,timColor,6)}
    </div>
    <button onClick=${()=>setExp(prev=>{const nx={...prev};nx[k.tim]=!nx[k.tim];return nx;})} style=${{fontSize:11,color:"#6B7280",background:"none",border:"none",cursor:"pointer",marginBottom:8,padding:0}}>
      ${isExp?"Sembunyikan daftar":"Tampilkan daftar"} (${k.total} orang, ${k.done} selesai)
    </button>
    ${isExp?html`<div class="s3">
      ${byKel.map(bk=>html`<div key=${bk.kel} style=${{borderRadius:8,border:"1px solid #F3F4F6",overflow:"hidden"}}>
        <div style=${{display:"flex",justifyContent:"space-between",padding:"8px 12px",background:"#F9FAFB",borderBottom:"1px solid #F3F4F6",alignItems:"center"}}>
          <span style=${{fontSize:11,fontWeight:700}}>Kel. ${bk.kel} - ${KH[bk.kel]||""}</span>
          <div style=${{display:"flex",gap:6,alignItems:"center"}}>
            <span style=${{fontSize:11,fontWeight:700,color:barColor(Math.round(bk.items.filter(p=>p.done).length/bk.items.length*100))}}>${bk.items.filter(p=>p.done).length+"/"+bk.items.length}</span>
            <a href=${mapsUrl("Kelurahan "+bk.kel+" Probolinggo")} target="_blank" rel="noreferrer" style=${{fontSize:10,color:"#2563EB",background:"#EFF6FF",border:"1px solid #BFDBFE",borderRadius:4,padding:"1px 5px",textDecoration:"none"}}>Maps</a>
          </div>
        </div>
        ${bk.items.map(p=>{
          const bg=p.done?"rgba(240,253,244,.5)":clBg(p.cluster);
          const bl=clBd(p.cluster);
          const nameTxt=p.nama;
          const alamatTxt=p.alamat;
          const coktasEl=coktasInfoView(p,true);
          const ketEl=ketBadge(p.ket);
          const mapEl=mapsBtn(p.alamat);
          return html`<div key=${p.id} style=${{padding:"10px 12px",borderBottom:"1px solid #FAFAFA",background:bg,borderLeft:bl}}>
            <div style=${{display:"flex",alignItems:"flex-start",gap:10}}>
              ${canEdit?html`<button onClick=${()=>handleToggle(p.id)} style=${{width:26,height:26,borderRadius:7,border:"2px solid "+(p.done?"#16A34A":"#D1D5DB"),background:p.done?"#16A34A":"transparent",color:"#fff",cursor:"pointer",flexShrink:0,marginTop:2,fontWeight:900,fontSize:13}}>
                ${p.done?"v":""}
              </button>`:html`<span style=${{fontSize:16,flexShrink:0,marginTop:2,color:p.done?"#16A34A":"#E5E7EB"}}>${p.done?"OK":"-"}</span>`}
              <div style=${{flex:1,minWidth:0}}>
                <div style=${{fontWeight:600,fontSize:13,color:p.done?"#16A34A":"#1F2937",textDecoration:p.done?"line-through":"none"}}>${nameTxt}</div>
                <div style=${{fontSize:11,color:"#9CA3AF",display:"flex",alignItems:"center",gap:3,flexWrap:"wrap"}}>${alamatTxt}${mapEl}</div>
                ${p.petunjuk?html`<div style=${{fontSize:10,color:"#92400E",background:"#FFFBEB",borderRadius:4,padding:"2px 7px",marginTop:3,display:"inline-block"}}>📌 ${p.petunjuk}</div>`:null}
                ${coktasEl}
              </div>
              ${ketEl}
            </div>
          </div>`;
        })}
      </div>`)}
    </div>`:null}
    ${k.catatan?html`<div style=${{marginTop:10,fontSize:11,color:"#92400E",background:"#FFFBEB",border:"1px solid #FDE68A",borderRadius:6,padding:"6px 10px"}}>${k.catatan}</div>`:null}
  </div>`;
}

/* ════ APP ════ */
function App(){
  const [role,setRole]=useState("Admin");
  const [tab,setTab]=useState("dashboard");
  const [search,setSearch]=useState("");
  const [fTim,setFTim]=useState("Semua");
  const [fKel,setFKel]=useState("Semua");
  const [pemilih,setPemilih]=useState(INIT_P);
  const [kegMeta,setKegMeta]=useState(INIT_KEG);
  const [dokumen,setDokumen]=useState(INIT_DOK);
  const [log,setLog]=useState(INIT_LOG);
  const [exp,setExp]=useState({"TIM 1":true,"TIM 2":true,"TIM 3":false});
  const [editKeg,setEditKeg]=useState(null);
  const [editDocId,setEditDocId]=useState(null);
  const [editDocVal,setEditDocVal]=useState("");
  const [showAddDoc,setShowAddDoc]=useState(false);
  const [newDoc,setNewDoc]=useState({nama:"",link:"",catatan:""});
  const [editP,setEditP]=useState(null);
  const [showAddP,setShowAddP]=useState(false);
  const [newP,setNewP]=useState({...EMPTY_P});
  const [delConfirm,setDelConfirm]=useState(null);
  const [coktasModal,setCoktasModal]=useState(null);
  const [batalConfirm,setBatalConfirm]=useState(null);
  const [saving,setSaving]=useState(false);
  const canEdit=role!=="Viewer";

  const pRef=useRef(pemilih);pRef.current=pemilih;
  const kRef=useRef(kegMeta);kRef.current=kegMeta;
  const dRef=useRef(dokumen);dRef.current=dokumen;
  const lRef=useRef(log);lRef.current=log;

  const save=useCallback((p,k,d,l)=>{
    setSaving(true);
    try{localStorage.setItem("ct8p",JSON.stringify(p));localStorage.setItem("ct8k",JSON.stringify(k));localStorage.setItem("ct8d",JSON.stringify(d));localStorage.setItem("ct8l",JSON.stringify(l));}catch(e){}
    setTimeout(()=>setSaving(false),700);
  },[]);

  useEffect(()=>{
    try{
      const rP=localStorage.getItem("ct8p");const rK=localStorage.getItem("ct8k");
      const rD=localStorage.getItem("ct8d");const rL=localStorage.getItem("ct8l");
      if(rP){const p=JSON.parse(rP);if(p&&p[0]&&p[0].tim)setPemilih(p);}
      if(rK){const k=JSON.parse(rK);if(k&&k[0]&&k[0].tim)setKegMeta(k);}
      if(rD)setDokumen(JSON.parse(rD));
      if(rL)setLog(JSON.parse(rL));
    }catch(e){}
  },[]);

  const addLog=useCallback((user,icon,action,detail,np,nk,nd)=>{
    const entry={id:Date.now(),time:nowStr(),user:user,icon:icon||"📝",action:action,detail:detail||""};
    const nl=[entry,...lRef.current];
    setLog(nl);
    save(np||pRef.current,nk||kRef.current,nd||dRef.current,nl);
  },[save]);

  const kegiatan=useMemo(()=>kegMeta.map(k=>{
    const kp=pemilih.filter(p=>p.tim===k.tim);
    const done=kp.filter(p=>p.done).length;
    const progres=kp.length?Math.round(done/kp.length*100):0;
    return Object.assign({},k,{total:kp.length,done:done,progres:progres});
  }),[kegMeta,pemilih]);

  const totalDone=pemilih.filter(p=>p.done).length;
  const ovPct=pemilih.length?Math.round(totalDone/pemilih.length*100):0;

  const filtP=useMemo(()=>pemilih.filter(p=>{
    if(fTim!=="Semua"&&p.tim!==fTim)return false;
    if(fKel!=="Semua"&&p.kel!==fKel)return false;
    if(!search)return true;
    const s=search.toLowerCase();
    return p.nama.toLowerCase().includes(s)||p.nik.includes(s)||p.ket.toLowerCase().includes(s)||p.alamat.toLowerCase().includes(s)||(p.coktasByPetugas&&p.coktasByPetugas.toLowerCase().includes(s));
  }),[pemilih,fTim,fKel,search]);

  const handleToggle=useCallback(id=>{
    if(!canEdit)return;
    const p=pemilih.find(x=>x.id===id);
    if(!p)return;
    if(p.done)setBatalConfirm(p);
    else setCoktasModal(p);
  },[canEdit,pemilih]);

  const confirmCoktas=(p,petugas,catatan)=>{
    const wkt=nowStr();
    const np=pemilih.map(x=>x.id===p.id?Object.assign({},x,{done:true,coktasByPetugas:petugas,coktasWaktu:wkt,coktasCatatan:catatan}):x);
    setPemilih(np);
    addLog(petugas,"✅","Coktas dicatat",p.nama+" | "+p.kel+" | "+p.tim,np);
    setCoktasModal(null);
  };
  const konfBatal=p=>{
    const np=pemilih.map(x=>x.id===p.id?Object.assign({},x,{done:false,coktasByPetugas:"",coktasWaktu:"",coktasCatatan:""}):x);
    setPemilih(np);
    addLog(role,"❌","Coktas dibatalkan",p.nama+" | "+p.tim,np);
    setBatalConfirm(null);
  };
  const updateStatus=(id,status)=>{
    const k=kegMeta.find(x=>x.id===id);
    const nk=kegMeta.map(x=>x.id===id?Object.assign({},x,{status:status,updated:nowStr()}):x);
    setKegMeta(nk);
    addLog(role,"📋","Status "+k.tim+" diubah",k.status+" -> "+status,undefined,nk);
  };
  const saveKeg=(id,f)=>{
    const k=kegMeta.find(x=>x.id===id);
    const nk=kegMeta.map(x=>x.id===id?Object.assign({},x,f,{updated:nowStr()}):x);
    setKegMeta(nk);
    addLog(role,"🔧","Data "+k.tim+" diperbarui","PIC: "+f.pic,undefined,nk);
    setEditKeg(null);
  };
  const savePEdit=p=>{
    const np=pemilih.map(x=>x.id===p.id?p:x);
    setPemilih(np);
    addLog(role,"✏️","Data pemilih diubah",p.nama+" | "+p.tim,np);
    setEditP(null);
  };
  const addPemilih=()=>{
    if(!newP.nama.trim()||!newP.nik.trim()){alert("Nama dan NIK wajib diisi!");return;}
    const p=Object.assign({},newP,{id:Date.now()});
    const np=[...pemilih,p];
    setPemilih(np);
    addLog(role,"➕","Pemilih ditambahkan",p.nama+" | "+p.tim,np);
    setNewP({...EMPTY_P});
    setShowAddP(false);
  };
  const delPemilih=id=>{
    const p=pemilih.find(x=>x.id===id);
    const np=pemilih.filter(x=>x.id!==id);
    setPemilih(np);
    addLog(role,"🗑️","Pemilih dihapus",p.nama+" | "+p.tim,np);
    setDelConfirm(null);
  };
  const startEditDoc=d=>{setEditDocId(d.id);setEditDocVal(d.link||"");};
  const saveDocLink=d=>{
    const nd=dokumen.map(x=>x.id===d.id?Object.assign({},x,{link:editDocVal}):x);
    setDokumen(nd);
    addLog(role,"📁","Link dokumen diperbarui",d.nama,undefined,undefined,nd);
    setEditDocId(null);setEditDocVal("");
  };
  const delDoc=d=>{
    const nd=dokumen.filter(x=>x.id!==d.id);
    setDokumen(nd);
    addLog(role,"🗑️","Dokumen dihapus",d.nama,undefined,undefined,nd);
  };

  const scKeys=Object.keys(SC);

  return html`<div style=${{minHeight:"100vh",background:"#F3F4F6"}}>

    <div style=${{background:"linear-gradient(135deg,#7F1D1D,#991B1B,#B91C1C)"}}>
      <div class="cn" style=${{paddingTop:20,paddingBottom:20}}>
        <div style=${{display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:12}}>
          <div>
            <div style=${{display:"flex",gap:8,flexWrap:"wrap",marginBottom:8}}>
              <span style=${{background:"rgba(255,255,255,.2)",color:"#fff",fontSize:11,padding:"2px 10px",borderRadius:999,fontWeight:600}}>KPU KOTA PROBOLINGGO</span>
              <span style=${{background:"#FCD34D",color:"#78350F",fontSize:11,padding:"2px 10px",borderRadius:999,fontWeight:600}}>CPNS 2024 Angkatan V</span>
              ${saving?html`<span style=${{background:"rgba(134,239,172,.8)",color:"#14532D",fontSize:11,padding:"2px 10px",borderRadius:999,fontWeight:600}}>Menyimpan...</span>`:null}
            </div>
            <h1 style=${{color:"#fff",fontWeight:900,fontSize:20,margin:0}}>Pelaksanaan Coktas PDPB Semester II</h1>
            <p style=${{color:"#FECACA",fontSize:13,fontWeight:500,margin:"3px 0 0"}}>KPU Kota Probolinggo - Kelompok A</p>
            <div style=${{display:"flex",gap:12,marginTop:8,flexWrap:"wrap",fontSize:12,color:"#FCA5A5"}}>
              <span>11-12 Mei 2026</span><span>3 Tim / 7 Anggota</span><span>${pemilih.length} Pemilih</span>
            </div>
          </div>
          <div style=${{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:8}}>
            <div style=${{display:"flex",alignItems:"center",gap:8}}>
              <span style=${{color:"#FCA5A5",fontSize:12}}>Akses:</span>
              <select value=${role} onChange=${e=>{const old=role;setRole(e.target.value);addLog(e.target.value,"👤","Hak akses diubah",old+" -> "+e.target.value);}} style=${{background:"rgba(255,255,255,.2)",color:"#fff",border:"1px solid rgba(255,255,255,.3)",borderRadius:8,padding:"4px 8px",fontSize:12,cursor:"pointer"}}>
                <option style=${{color:"#111",background:"#fff"}}>Admin</option>
                <option style=${{color:"#111",background:"#fff"}}>Editor</option>
                <option style=${{color:"#111",background:"#fff"}}>Viewer</option>
              </select>
            </div>
            <div style=${{textAlign:"right"}}><div style=${{fontSize:28,fontWeight:900,color:"#fff"}}>${ovPct}%</div><div style=${{fontSize:11,color:"#FCA5A5"}}>Overall</div></div>
          </div>
        </div>
        <div style=${{marginTop:14}}>
          <div style=${{display:"flex",justifyContent:"space-between",fontSize:11,color:"#FCA5A5",marginBottom:5}}>
            <span>${totalDone} dicoktas</span><span>${pemilih.length-totalDone} belum</span>
          </div>
          <div style=${{background:"rgba(0,0,0,.25)",borderRadius:999,height:16,overflow:"hidden"}}>
            <div style=${{width:ovPct+"%",background:"linear-gradient(90deg,#FCD34D,#FBBF24)",height:"100%",borderRadius:999,transition:"width .6s"}}/>
          </div>
        </div>
      </div>
    </div>

    <div class="tabbar no-print">
      <div class="cn" style=${{display:"flex",overflowX:"auto"}}>
        ${[{id:"dashboard",l:"Dashboard"},{id:"monitoring",l:"Monitoring"},{id:"pemilih",l:"Data Pemilih"},{id:"rekap",l:"Rekap"},{id:"tim",l:"Tim"},{id:"dokumen",l:"Dokumen"},{id:"log",l:"Log"}].map(t=>html`
          <button key=${t.id} onClick=${()=>setTab(t.id)} style=${{padding:"12px 14px",border:"none",borderBottom:"2px solid "+(tab===t.id?"#B91C1C":"transparent"),background:tab===t.id?"#FEF2F2":"transparent",color:tab===t.id?"#B91C1C":"#6B7280",fontWeight:tab===t.id?700:400,cursor:"pointer",fontSize:12,flexShrink:0,whiteSpace:"nowrap"}}>
            ${t.l}
          </button>`)}
      </div>
    </div>

    <div class="cn" style=${{paddingTop:24,paddingBottom:24}}>

      ${tab==="dashboard"?html`<div class="s5">
        <div class="g4">
          ${[{l:"Total Pemilih",v:pemilih.length,c:"#991B1B",bg:"#FEF2F2"},{l:"Sudah Dicoktas",v:totalDone,c:"#16A34A",bg:"#F0FDF4"},{l:"Belum Dicoktas",v:pemilih.length-totalDone,c:"#D97706",bg:"#FFFBEB"},{l:"Tim Selesai",v:kegiatan.filter(k=>k.status==="Selesai").length+"/3",c:"#2563EB",bg:"#EFF6FF"}].map((c,i)=>html`
            <div key=${i} style=${{background:c.bg,borderLeft:"4px solid "+c.c,borderRadius:12,padding:16,boxShadow:"0 1px 4px rgba(0,0,0,.07)"}}>
              <div style=${{color:c.c,fontSize:26,fontWeight:900}}>${c.v}</div>
              <div style=${{fontSize:13,fontWeight:600,color:"#374151",marginTop:4}}>${c.l}</div>
            </div>`)}
        </div>
        <div class="g3">
          ${kegiatan.map(k=>html`
            <div key=${k.id} style=${{borderTop:"3px solid "+TC[k.tim],background:TB[k.tim],borderRadius:12,padding:20,border:"1px solid #F3F4F6",boxShadow:"0 1px 4px rgba(0,0,0,.07)"}}>
              <div style=${{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}}>${tBadge(k.tim)}${sBadge(k.status)}</div>
              <div style=${{fontSize:28,fontWeight:900,color:TC[k.tim]}}>${k.done+"/"+k.total}</div>
              <div style=${{fontSize:11,color:"#6B7280",marginBottom:8}}>dicoktas - ${k.progres}%</div>
              ${pBar(k.progres,TC[k.tim],6)}
              <div style=${{fontSize:11,color:"#6B7280",marginTop:8}}>${k.pic}</div>
            </div>`)}
        </div>
        <div class="g2">
          <div style=${CARD}>
            <p style=${{fontWeight:700,fontSize:13,marginBottom:14}}>Progress per Kelurahan</p>
            ${KELS.map(kel=>{
              const kp=pemilih.filter(p=>p.kel===kel);
              const d=kp.filter(p=>p.done).length;
              const pct=kp.length?Math.round(d/kp.length*100):0;
              const ts=[...new Set(kp.map(p=>p.tim))];
              return html`<div key=${kel} style=${{marginBottom:14}}>
                <div style=${{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
                  <div style=${{display:"flex",alignItems:"center",gap:5,flexWrap:"wrap"}}>
                    <span style=${{fontWeight:600,fontSize:13}}>${kel}</span>
                    ${ts.map(t=>html`<span key=${t} style=${{background:TC[t]+"20",color:TC[t],fontSize:9,padding:"1px 5px",borderRadius:4,fontWeight:700}}>${t}</span>`)}
                  </div>
                  <span style=${{fontSize:11,fontWeight:700}}>${d+"/"+kp.length}</span>
                </div>
                ${pBar(pct,barColor(pct),6)}
              </div>`;
            })}
          </div>
          <div style=${CARD}>
            <p style=${{fontWeight:700,fontSize:13,marginBottom:8}}>Proporsi Coktas</p>
            <div style=${{display:"flex",justifyContent:"center"}}>${donutChart(totalDone,pemilih.length)}</div>
            <div style=${{marginTop:8}}>
              ${["TIM 1","TIM 2","TIM 3"].map(t=>{
                const kp=pemilih.filter(p=>p.tim===t);
                const d=kp.filter(p=>p.done).length;
                const pct=kp.length?Math.round(d/kp.length*100):0;
                return html`<div key=${t} style=${{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
                  <span style=${{color:TC[t],fontWeight:700,fontSize:11,width:42}}>${t}</span>
                  <div style=${{flex:1}}>${pBar(pct,TC[t],5)}</div>
                  <span style=${{fontWeight:700,color:"#374151",fontSize:11,width:70,textAlign:"right"}}>${d+"/"+kp.length+" ("+pct+"%)"}</span>
                </div>`;
              })}
            </div>
          </div>
        </div>
      </div>`:null}

      ${tab==="monitoring"?html`<div class="s4">
        <div style=${{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:8}}>
          <h2 style=${{fontSize:18,fontWeight:700,margin:0}}>Monitoring 3 Tim</h2>
          ${!canEdit?html`<span style=${{fontSize:11,color:"#D97706",background:"#FFFBEB",border:"1px solid #FDE68A",borderRadius:999,padding:"3px 10px"}}>Viewer</span>`:null}
        </div>
        ${kegiatan.map(k=>html`
          <div key=${k.id} style=${{background:"#fff",borderRadius:12,border:"1px solid #F3F4F6",overflow:"hidden",boxShadow:"0 1px 4px rgba(0,0,0,.07)"}}>
            <div style=${{borderLeft:"5px solid "+(TC[k.tim]||"#991B1B"),padding:20}}>
              <${KegCard} k=${k} pemilih=${pemilih} canEdit=${canEdit} exp=${exp} setExp=${setExp} editKeg=${editKeg} setEditKeg=${setEditKeg} updateStatus=${updateStatus} saveKeg=${saveKeg} handleToggle=${handleToggle}/>
            </div>
          </div>`)}
      </div>`:null}

      ${tab==="pemilih"?html`<div class="s4">
        <div style=${{display:"flex",flexWrap:"wrap",gap:10,alignItems:"center",justifyContent:"space-between"}}>
          <h2 style=${{fontSize:18,fontWeight:700,margin:0}}>Data Pemilih (${filtP.length})</h2>
          <div style=${{display:"flex",flexWrap:"wrap",gap:8}}>

                ${d.link?html`<a href=${d.link} target="_blank" rel="noreferrer" style=${{flex:1,textAlign:"center",fontSize:12,background:"#1A73E8",color:"#fff",borderRadius:8,padding:"7px 4px",textDecoration:"none",fontWeight:600,minWidth:60}}>Buka</a>`:null}
                ${d.link?html`<button onClick=${()=>{try{navigator.clipboard.writeText(d.link);alert("Link disalin!");}catch(e){alert("Salin manual: "+d.link);}}} style=${{fontSize:12,border:"1px solid #E5E7EB",borderRadius:8,padding:"7px 10px",cursor:"pointer",background:"#fff",color:"#374151"}}>Salin</button>`:null}
                ${canEdit?html`<button onClick=${()=>startEditDoc(d)} style=${{fontSize:12,border:"1px solid #E5E7EB",borderRadius:8,padding:"7px 10px",cursor:"pointer",background:"#fff",color:"#374151",flex:d.link?"0":"1"}}>${d.link?"Edit":"Isi Link"}</button>`:null}
              </div>
            </div>`}
          </div>`)}
        </div>
        <div style=${{background:"#FFFBEB",border:"1px solid #FDE68A",borderRadius:10,padding:14,fontSize:12,color:"#92400E"}}>
          <div style=${{fontWeight:700,marginBottom:6}}>Cara mengelola dokumen:</div>
          <div>1. Klik "Upload File" - Google Drive terbuka - upload dokumen baru</div>
          <div>2. Klik kanan file di Drive - "Bagikan" - salin link</div>
          <div>3. Klik "Isi Link" pada kartu - tempel link - Simpan</div>
        </div>
      </div>`:null}

      ${tab==="log"?html`<div class="s4">
        <div style=${{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:8}}>
          <h2 style=${{fontSize:18,fontWeight:700,margin:0}}>Log Aktivitas</h2>
          <div style=${{display:"flex",gap:8,alignItems:"center"}}>
            <span style=${{fontSize:11,color:"#9CA3AF",background:"#F3F4F6",borderRadius:999,padding:"3px 10px"}}>${log.length} entri</span>
            ${canEdit?html`<button onClick=${()=>{if(window.confirm("Reset log?"))setLog(INIT_LOG);}} style=${{fontSize:11,border:"1px solid #FEE2E2",color:"#DC2626",background:"#FEF2F2",borderRadius:8,padding:"4px 10px",cursor:"pointer"}}>Reset</button>`:null}
          </div>
        </div>
        <div style=${{...CARD,padding:0,overflow:"hidden"}}>
          ${log.map((l,i)=>html`<div key=${l.id} style=${{display:"flex",alignItems:"flex-start",gap:12,padding:"14px 20px",borderBottom:i<log.length-1?"1px solid #F9FAFB":"none"}}>
            <div style=${{width:36,height:36,borderRadius:"50%",background:"hsl("+(l.user.charCodeAt(0)*37)%360+",50%,88%)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,flexShrink:0}}>${l.icon||"?"}</div>
            <div style=${{flex:1,minWidth:0}}>
              <div style=${{fontWeight:700,fontSize:13,color:"#1F2937"}}>${l.action}</div>
              ${l.detail?html`<div style=${{fontSize:11,color:"#4B5563",marginTop:3,padding:"4px 8px",background:"#F9FAFB",borderRadius:5}}>${l.detail}</div>`:null}
              <div style=${{fontSize:10,color:"#9CA3AF",marginTop:4}}>${l.user+" - "+l.time}</div>
            </div>
          </div>`)}
        </div>
      </div>`:null}

    </div>

    <!-- MODALS -->
    ${coktasModal?html`<${CoktasModal} p=${coktasModal} onConfirm=${confirmCoktas} onCancel=${()=>setCoktasModal(null)}/>`:null}

    ${batalConfirm?html`<${Modal} title="Batalkan Coktas?" onClose=${()=>setBatalConfirm(null)}>
      <div style=${{textAlign:"center",padding:"8px 0 16px"}}>
        <div style=${{fontSize:40,marginBottom:10}}>!</div>
        <p style=${{fontWeight:700,fontSize:15,marginBottom:6,margin:"0 0 6px 0"}}>Batalkan status coktas?</p>
        <p style=${{color:"#6B7280",fontSize:13,marginBottom:20,margin:"0 0 20px 0"}}>${batalConfirm.nama}</p>
        <div style=${{display:"flex",gap:10}}>
          <button onClick=${()=>konfBatal(batalConfirm)} style=${{flex:1,background:"#DC2626",color:"#fff",border:"none",borderRadius:10,padding:"10px",fontSize:13,fontWeight:700,cursor:"pointer"}}>Ya, Batalkan</button>
          <button onClick=${()=>setBatalConfirm(null)} style=${{flex:1,border:"1px solid #E5E7EB",borderRadius:10,padding:"10px",fontSize:13,cursor:"pointer",background:"#fff",color:"#6B7280"}}>Kembali</button>
        </div>
      </div>
    </${Modal}>`:null}

    ${editP?html`<${Modal} title="Edit Data Pemilih" onClose=${()=>setEditP(null)}>
      <div class="g2s" style=${{fontSize:13,marginBottom:16}}>
        <div><label style=${{fontSize:11,fontWeight:600,color:"#6B7280",display:"block",marginBottom:4}}>Tim</label>
          <select value=${editP.tim} onChange=${e=>setEditP({...editP,tim:e.target.value})} class=${INP}><option>TIM 1</option><option>TIM 2</option><option>TIM 3</option></select></div>
        <div><label style=${{fontSize:11,fontWeight:600,color:"#6B7280",display:"block",marginBottom:4}}>Kelurahan</label>
          <select value=${editP.kel} onChange=${e=>setEditP({...editP,kel:e.target.value})} class=${INP}>${KELS.map(k=>html`<option key=${k}>${k}</option>`)}</select></div>
        ${[{l:"NIK",k:"nik"},{l:"Nama",k:"nama",f:true},{l:"TTL",k:"ttl",f:true},{l:"Alamat",k:"alamat",f:true},{l:"Petunjuk",k:"petunjuk",f:true}].map(fld=>html`
          <div key=${fld.k} class=${fld.f?"sp2":""}>
            <label style=${{fontSize:11,fontWeight:600,color:"#6B7280",display:"block",marginBottom:4}}>${fld.l}</label>
            <input value=${editP[fld.k]||""} onChange=${e=>setEditP({...editP,[fld.k]:e.target.value})} class=${INP}/>
          </div>`)}
        ${[{l:"JK",k:"jk",o:["L","P"]},{l:"Kawin",k:"kawin",o:["Belum","Sudah"]},{l:"E-KTP",k:"ektp",o:["Belum","Sudah"]}].map(fld=>html`
          <div key=${fld.k}><label style=${{fontSize:11,fontWeight:600,color:"#6B7280",display:"block",marginBottom:4}}>${fld.l}</label>
            <select value=${editP[fld.k]} onChange=${e=>setEditP({...editP,[fld.k]:e.target.value})} class=${INP}>${fld.o.map(o=>html`<option key=${o}>${o}</option>`)}</select></div>`)}
        <div class="sp2"><label style=${{fontSize:11,fontWeight:600,color:"#6B7280",display:"block",marginBottom:4}}>Keterangan</label>
          <select value=${editP.ket} onChange=${e=>setEditP({...editP,ket:e.target.value})} class=${INP}>${KET_OPTS.map(k=>html`<option key=${k}>${k}</option>`)}</select></div>
        ${editP.done?html`<div class="sp2" style=${{background:"#F0FDF4",border:"1px solid #BBF7D0",borderRadius:8,padding:10}}>
          <p style=${{fontSize:11,fontWeight:600,color:"#16A34A",margin:"0 0 6px 0"}}>Dicoktas oleh ${editP.coktasByPetugas}</p>
          <label style=${{fontSize:11,fontWeight:600,color:"#374151",display:"block",marginBottom:4}}>Edit Catatan Coktas</label>
          <textarea value=${editP.coktasCatatan||""} onChange=${e=>setEditP({...editP,coktasCatatan:e.target.value})} rows="2" class=${INP}/>
        </div>`:null}
      </div>
      <div style=${{display:"flex",gap:10}}>
        <button onClick=${()=>savePEdit(editP)} style=${{flex:1,background:"#991B1B",color:"#fff",border:"none",borderRadius:10,padding:"10px",fontSize:13,fontWeight:700,cursor:"pointer"}}>Simpan</button>
        <button onClick=${()=>setEditP(null)} style=${{padding:"10px 18px",border:"1px solid #E5E7EB",borderRadius:10,fontSize:13,cursor:"pointer",background:"#fff",color:"#6B7280"}}>Batal</button>
      </div>
    </${Modal}>`:null}

    ${delConfirm?html`<${Modal} title="Konfirmasi Hapus" onClose=${()=>setDelConfirm(null)}>
      <div style=${{textAlign:"center",padding:"8px 0 16px"}}>
        <p style=${{fontWeight:700,fontSize:15,marginBottom:6,margin:"0 0 6px 0"}}>Hapus Data Pemilih?</p>
        <p style=${{color:"#6B7280",fontSize:13,marginBottom:20,margin:"0 0 20px 0"}}>${(pemilih.find(p=>p.id===delConfirm)||{nama:""}).nama}</p>
        <div style=${{display:"flex",gap:10}}>
          <button onClick=${()=>delPemilih(delConfirm)} style=${{flex:1,background:"#DC2626",color:"#fff",border:"none",borderRadius:10,padding:"10px",fontSize:13,fontWeight:700,cursor:"pointer"}}>Ya, Hapus</button>
          <button onClick=${()=>setDelConfirm(null)} style=${{flex:1,border:"1px solid #E5E7EB",borderRadius:10,padding:"10px",fontSize:13,cursor:"pointer",background:"#fff",color:"#6B7280"}}>Batal</button>
        </div>
      </div>
    </${Modal}>`:null}

    <div style=${{textAlign:"center",padding:"14px",fontSize:11,color:"#9CA3AF",borderTop:"1px solid #E5E7EB",marginTop:32,background:"#fff"}}>
      KPU Kota Probolinggo - CPNS 2024 Angkatan V - Coktas PDPB Semester II - Kelompok A - Auto-save
    </div>
  </div>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
</body>
</html>
